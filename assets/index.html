<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MorseToSpeech</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5d6470;
    --line: #dde1e7; --accent: #1f6feb; --accent-text: #ffffff;
    --warn-bg: #fff4d6; --warn-text: #7a5300; --ok: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa2ad;
      --line: #2a2f38; --accent: #4c8dff; --accent-text: #0b0d10;
      --warn-bg: #3a2f12; --warn-text: #ffd479; --ok: #4ac26b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 12px;
  }
  .label { font-size: 14px; font-weight: 600; color: var(--muted);
           text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .lang {
    min-height: 64px; border-radius: 12px; border: 2px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  }
  .lang[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .lang:focus-visible, .swap:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .swap-row { display: flex; justify-content: center; margin: -2px 0 10px; }
  .swap {
    min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 16px; cursor: pointer;
  }
  .flow { list-style: none; padding: 0; margin: 0; }
  .flow li { padding: 10px 0; border-top: 1px solid var(--line); }
  .flow li:first-child { border-top: 0; padding-top: 0; }
  .flow b { font-weight: 600; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px;
         border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
  .tag.on { color: var(--ok); border-color: var(--ok); }
  .warnings { list-style: none; padding: 0; margin: 12px 0 0; }
  .warnings li { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px;
                 padding: 10px 12px; margin-top: 8px; font-size: 15px; }
  .status { min-height: 24px; color: var(--muted); font-size: 15px; text-align: center; margin-top: 8px; }
  .status.error { color: #d1242f; }
</style>
</head>
<body>
<main>
  <h1>MorseToSpeech</h1>
  <p class="sub">Choose who speaks which language. Everything is translated offline on the device.</p>

  <section class="card" aria-labelledby="user-label">
    <p class="label" id="user-label">You (Morse)</p>
    <p class="hint">The language you tap and receive Morse in.</p>
    <div class="options" id="user-options" role="group" aria-labelledby="user-label"></div>
  </section>

  <div class="swap-row">
    <button class="swap" id="swap" type="button" aria-label="Swap languages">⇅ Swap</button>
  </div>

  <section class="card" aria-labelledby="partner-label">
    <p class="label" id="partner-label">Conversation partner (speech)</p>
    <p class="hint">The language your partner speaks and hears.</p>
    <div class="options" id="partner-options" role="group" aria-labelledby="partner-label"></div>
  </section>

  <section class="card" aria-labelledby="flow-label">
    <p class="label" id="flow-label">What happens</p>
    <ul class="flow" id="flow"></ul>
    <ul class="warnings" id="warnings"></ul>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>

<script>
  const API = "/api/languages";
  let state = null;
  let busy = false;

  const nameOf = (code) => (state.languages.find((l) => l.code === code) || {}).name || code;

  function renderOptions(containerId, role) {
    const box = document.getElementById(containerId);
    box.textContent = "";
    for (const lang of state.languages) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lang";
      b.textContent = lang.name;
      b.setAttribute("aria-pressed", String(state[role] === lang.code));
      b.addEventListener("click", () => {
        if (state[role] === lang.code) return;
        const next = { user: state.user, partner: state.partner };
        next[role] = lang.code;
        save(next.user, next.partner);
      });
      box.appendChild(b);
    }
  }

  function render() {
    renderOptions("user-options", "user");
    renderOptions("partner-options", "partner");

    const same = state.user === state.partner;
    const flow = document.getElementById("flow");
    flow.innerHTML = "";
    const items = [
      [`You tap <b>${nameOf(state.user)}</b> → partner hears <b>${nameOf(state.translating_out ? state.partner : state.user)}</b>`,
       same ? "same language" : state.translating_out ? "translated" : "not translated", state.translating_out],
      [`Partner speaks <b>${nameOf(state.partner)}</b> → you get Morse in <b>${nameOf(state.translating_in ? state.user : state.partner)}</b>`,
       same ? "same language" : state.translating_in ? "translated" : "not translated", state.translating_in],
    ];
    for (const [html, tag, on] of items) {
      const li = document.createElement("li");
      li.innerHTML = `${html}<span class="tag${on ? " on" : ""}">${tag}</span>`;
      flow.appendChild(li);
    }
    if (state.translating_out) {
      const li = document.createElement("li");
      li.textContent = "Press C to speak the whole sentence (translation needs complete sentences).";
      flow.appendChild(li);
    }

    const warn = document.getElementById("warnings");
    warn.textContent = "";
    for (const w of state.warnings) {
      const li = document.createElement("li");
      li.textContent = w;
      warn.appendChild(li);
    }
  }

  function setStatus(text, isError) {
    const s = document.getElementById("status");
    s.textContent = text;
    s.classList.toggle("error", !!isError);
  }

  async function load() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      state = await r.json();
      render();
      if (!busy) setStatus("");
    } catch (e) {
      setStatus("Can't reach the device. Is the app running?", true);
    }
  }

  async function save(user, partner) {
    busy = true;
    setStatus("Saving…");
    try {
      const q = new URLSearchParams({ user, partner });
      const r = await fetch(`${API}?${q}`, { method: "POST" });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      state = await r.json();
      render();
      setStatus("Saved ✓");
    } catch (e) {
      setStatus(`Couldn't save: ${e.message}`, true);
    } finally {
      busy = false;
    }
  }

  document.getElementById("swap").addEventListener("click", () => {
    if (state) save(state.partner, state.user);
  });

  load();
  setInterval(load, 10000);   // pick up changes made from another screen
</script>
</body>
</html>
